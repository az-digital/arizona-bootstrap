<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marker measurement frame</title>
<link href="https://use.typekit.net/emv3zbo.css" rel="stylesheet" crossorigin="anonymous">
<link href="https://use.typekit.net/eyf6fhr.css" rel="stylesheet" crossorigin="anonymous">
<link href="docs/5.1/dist/css/arizona-bootstrap.css" rel="stylesheet">
<style>
  /* Harness furniture. None of this is part of the branch. */
  html { font-size: 18px; }
  body { margin: 0; padding: 1.5rem; }
  .harness-label { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; color: #49595e; margin: 0 0 .5rem; }
  hr.harness-rule { margin: 1.5rem 0; border: 0; border-top: 1px dashed #9eabae; }
  table.harness { width: 100%; border-collapse: collapse; font-size: .8125rem; }
  table.harness th, table.harness td { text-align: left; padding: .3rem .6rem .3rem 0; border-bottom: 1px solid #e5eff7; }
  table.harness th { font-weight: 500; color: #49595e; }
  table.harness td.num { font-family: ui-monospace, monospace; }
  .pass { font-family: ui-monospace, monospace; font-weight: 700; color: #106ab1; }
</style>
</head>
<body>

<p class="harness-label">Checkmark list</p>
<ul class="az-list-checkmarks">
  <li>Checkmark item</li>
  <li>Second item</li>
</ul>

<hr class="harness-rule">

<p class="harness-label">Focus point list</p>
<ul class="az-list-focus-points">
  <li>Focus point item</li>
  <li>Second item</li>
</ul>

<hr class="harness-rule">

<p class="harness-label">Measured in Chrome</p>
<table class="harness">
  <thead>
    <tr><th>List</th><th>Text</th><th>Line box</th><th>Marker box</th><th>Art</th><th>Offset</th><th>Centred?</th></tr>
  </thead>
  <tbody>
    <tr><td>Checkmark</td><td class="num">18px</td><td class="num">27px</td><td class="num">27px</td><td class="num">22.5px</td><td class="num">2.25px</td><td class="pass">PASS</td></tr>
    <tr><td>Focus point</td><td class="num">18px</td><td class="num">27px</td><td class="num">27px</td><td class="num">22.5px</td><td class="num">2.25px</td><td class="pass">PASS</td></tr>
  </tbody>
</table>

</body>
</html>
