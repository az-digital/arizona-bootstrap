name: Create PR for new Arizona Digital design tokens
run-name: Create PR updating `${{ inputs.branch || github.event.client_payload.branch || 'main' }}` with az-digital/design tokens from `${{ inputs.design_ref || github.event.client_payload.ref || 'main' }}`
on:
  repository_dispatch:
    types: [az_design_tokens_release]
  workflow_dispatch:
    inputs:
      design_ref:
        description: The az-digital/design branch, tag, or commit SHA to take the tokens from
        required: true
        default: main
      branch:
        description: The Arizona Bootstrap branch to open the PR against
        required: true
        default: main

concurrency:
  group: design-tokens-sync
  cancel-in-progress: false

env:
  DESIGN_REPO: az-digital/design
  DESIGN_TOKENS_PATH: packages/tokens/dist/tokens.css
  TOKENS_DIR: scss/vendor/az-design-tokens
  DESIGN_REF: ${{ inputs.design_ref || github.event.client_payload.ref || 'main' }}
  TARGET_BRANCH: ${{ inputs.branch || github.event.client_payload.branch || 'main' }}

jobs:
  sync:
    name: Create PR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate inputs
        run: |
          if ! [[ "${DESIGN_REF}" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "${DESIGN_REF}" == *..* ]]; then
            echo "::error::Invalid az-digital/design ref: '${DESIGN_REF}'"
            exit 1
          fi
          if ! git check-ref-format --branch "${TARGET_BRANCH}" > /dev/null; then
            echo "::error::Invalid target branch: '${TARGET_BRANCH}'"
            exit 1
          fi

      # REPO_DISPATCH_TOKEN (not GITHUB_TOKEN) pushes the branch and opens the
      # PR, so that the PR triggers review-site.yml like any other PR.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Create new branch and PR
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          sha=$(gh api "repos/${DESIGN_REPO}/commits/${DESIGN_REF}" --jq .sha)
          short_sha="${sha:0:7}"
          branch="design-tokens-${short_sha}"
          source_url="https://github.com/${DESIGN_REPO}/blob/${sha}/${DESIGN_TOKENS_PATH}"

          if git ls-remote --exit-code --heads origin "${branch}" > /dev/null; then
            echo "::notice::Branch ${branch} already exists; nothing to do."
            exit 0
          fi

          previous_sha=$(sed -nE "s#^// Source: https://github.com/${DESIGN_REPO}/blob/([0-9a-f]{40})/.*#\1#p" "${TOKENS_DIR}/_variables.scss" 2> /dev/null || true)

          gh api -H 'Accept: application/vnd.github.raw' "repos/${DESIGN_REPO}/contents/${DESIGN_TOKENS_PATH}?ref=${sha}" > "${RUNNER_TEMP}/tokens.css"

          # Keep everything from the first :root block on, dropping the
          # generator's banner comment.
          root_css=$(sed -n '/^:root {/,$p' "${RUNNER_TEMP}/tokens.css")
          # Mirror each custom property in the first :root block as a Sass
          # variable, so Arizona Bootstrap's Sass color functions can use it.
          sass_vars=$(sed -n '/^:root {/,/^}/p' "${RUNNER_TEMP}/tokens.css" | sed -nE 's/^[[:space:]]*--([a-z0-9-]+):[[:space:]]*(.+);[[:space:]]*$/$\1: \2;/p')
          if [ -z "${root_css}" ] || [ -z "${sass_vars}" ]; then
            echo "::error::No tokens found in ${source_url}"
            exit 1
          fi

          header="// Generated by .github/workflows/design-tokens-sync.yml. Do not edit.
          // Source: ${source_url}"

          mkdir -p "${TOKENS_DIR}"
          printf '%s\n\n%s\n' "${header}" "${root_css}" > "${TOKENS_DIR}/_tokens.scss"
          printf '%s\n\n// fusv-disable\n%s\n// fusv-enable\n' "${header}" "${sass_vars}" > "${TOKENS_DIR}/_variables.scss"

          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "${GITHUB_ACTOR}"
          git checkout -b "${branch}"
          git add "${TOKENS_DIR}"
          if git diff --cached --quiet; then
            echo "::notice::Tokens at ${DESIGN_REPO}@${short_sha} match ${TARGET_BRANCH}; nothing to do."
            exit 0
          fi

          git commit -m "Update Arizona Digital design tokens to ${DESIGN_REPO}@${short_sha}"
          git push --set-upstream origin "${branch}"

          body="Updates the Arizona Digital design tokens in \`${TOKENS_DIR}/\` from [\`${DESIGN_REPO}@${short_sha}\`](${source_url})."
          if [ -n "${previous_sha}" ]; then
            body="${body}

          Changes since the last sync: https://github.com/${DESIGN_REPO}/compare/${previous_sha}...${sha}"
          fi
          body="${body}

          This PR was opened automatically. It targets \`${TARGET_BRANCH}\`; retarget it if the tokens belong in a release branch."

          gh pr create --base "${TARGET_BRANCH}" --head "${branch}" --title "Update Arizona Digital design tokens to ${DESIGN_REPO}@${short_sha}" --body "${body}"
